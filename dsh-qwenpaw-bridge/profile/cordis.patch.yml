# Sample user patch for the `qwenpaw` profile.
#
# The bridge bundle already disables the stock `acp` row and inserts
# `qwenpaw-bridge`. This layer supplies the deployment's model route; if you
# omit it, the bridge falls back to ctx.agentDefaultModel.
#
# Replace `opencode-go` / `deepseek-v4.1-flash` with your route, and add the
# matching llm-pi-ai provider block (or another LLM adapter) as usual.

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash

- id: qwenpaw-bridge
  name: '@local/dsh-qwenpaw-bridge'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    streaming: true
    permissionPresets: true
    models: true
